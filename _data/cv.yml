    Research Experience:
      - company: University of Southern California
        position: Directed Research — Cost-Effectiveness of AI-Based Glaucoma Screening
        location: Los Angeles, CA
        start_date: 2025-08
        end_date: present
        summary: With Dr. Shinyi Wu (Suzanne Dworak-Peck School of Social Work)
        highlights:
          - Developed a hybrid decision tree–Markov model simulating long-term progression across glaucoma severity states, parameterized with published epidemiological data and real-world costs.
          - Implemented deterministic and probabilistic (Monte Carlo) sensitivity analyses in Python to estimate costs, QALYs, and ICERs.
          - Preliminary results suggest AI-based screening is cost-effective (ICER ≈ $13,000/QALY).

      - company: West China Biomedical Big Data Lab
        position: Research Assistant — Cohort Study Project
        location: Chengdu, China
        start_date: 2023-09
        end_date: 2024-12
        summary: With Dr. Fashu Xu and Dr. Xiaolei Liu
        highlights:
          - Processed 16,000+ annual CHARLS samples (2011–2015) in Python; fit continuous-time Markov models in R for 1-, 2-, and 4-year transition probabilities.
          - Developed a covariate-adjusted Markov model to assess socio-demographic effects (HRs and 95% CIs).
          - Contributed to a Chinese Medical Journal publication (data processing and methods).

      - company: Sichuan University–Pittsburgh Institute
        position: Group Leader — System Optimization Program
        location: Chengdu, China
        start_date: 2022-09
        end_date: 2023-05
        summary: With Dr. Don Liang
        highlights:
          - Optimized a dehumidification coating via multi-objective optimization, achieving a 2.5× improvement over conventional dehumidifiers.
          - Led the patent application for a TPMS-structure dehumidification heat exchanger.
          - Chinese National Student Innovation Project Excellence Award.

